amcl:
  ros__parameters:
    use_sim_time: false

    # Tracked skid-steer base: AMCL consumes the existing odom -> base_link TF.
    robot_model_type: nav2_amcl::DifferentialMotionModel
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    map_topic: map
    tf_broadcast: true
    transform_tolerance: 0.5

    # Start every imported-map test with an explicit RViz 2D Pose Estimate.
    # A pose saved for the native h753 map must never be reused on the Go2 map.
    set_initial_pose: false
    always_reset_initial_pose: true
    first_map_only: true
    save_pose_rate: 0.5

    # Conservative baseline. Beam skipping remains off until a recorded scan
    # proves that Go2-vs-Tmini height/glass differences require it.
    laser_model_type: likelihood_field
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    laser_likelihood_max_dist: 2.0
    laser_min_range: 0.03
    laser_max_range: 12.0
    max_beams: 120

    min_particles: 500
    max_particles: 3000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.10
    update_min_a: 0.10

    # Initial odometry noise values. Tune only from straight/rotation tests.
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
    topic_name: map
    frame_id: map
