h753_cmd_vel_uart_bridge:
  ros__parameters:
    cmd_vel_topic: /cmd_vel_safe
    # Robot-internal output of h753_vlm_gateway: std_msgs/msg/Int32,
    # 0=drive enabled, 1=stop. The UART bridge never trusts the remote server
    # topic directly. If the gateway is not launched, this guard is inactive.
    injury_stop_topic: /safety/vlm_stop
    scan_topic: /scan
    require_scan: true
    scan_timeout_s: 0.50
    uart_port: ""
    uart_baud: 921600
    lock_file: /home/jyl1015/ros2_graduation_project_ws/h753_ros_humble/tools/logs/xbox_uart_control.lock
    # Stop if collision_monitor output is stale. Keep this below the STM
    # firmware's independent 0.8 s command timeout.
    deadman_timeout_s: 0.30
    transmit_period_s: 0.05
    # Match the legacy UART teleop speed envelope so ROS manual driving feels
    # identical: linear 0.60 m/s, angular 2.67 rad/s, track speed 0.60 m/s.
    max_linear_mps: 0.60
    max_angular_radps: 2.67
    # Keep STM physical coordinates unchanged. Override only for ROS-side
    # integration diagnostics; standalone run_xbox_uart_drive.sh is unaffected.
    linear_command_sign: -1.0
    angular_command_sign: -1.0
    # Must match STM EFFECTIVE_TRACK_WIDTH_M used by inverse kinematics.
    track_gauge_m: 0.45
    max_track_speed_mps: 0.60
    # STM open-loop feedforward is PWM[%] = track_speed / 0.60 * 100.
    # Field testing confirmed that the loaded robot only begins moving at 50%.
    # Raise every non-zero moving track to 50%; exact zero remains stopped.
    min_track_pwm_percent: 50.0
    # A tracked in-place turn needs more breakaway torque than translation.
    # Keep straight/curved commands on the 50% floor, but raise near-zero
    # linear commands with non-zero yaw to 60% per track.
    min_in_place_turn_pwm_percent: 60.0
    in_place_turn_linear_threshold_mps: 0.02
    # Same target deadband as the STM firmware. It also keeps an intentionally
    # stationary inner track at zero during a one-track pivot.
    track_zero_deadband_mps: 0.01
