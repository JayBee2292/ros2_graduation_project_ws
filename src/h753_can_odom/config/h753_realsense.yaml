/camera/camera:
  ros__parameters:
    # VLM/navigation profile. SLAM/Nav2 uses lidar and wheel odom, so only the
    # RGB stream and the separately enabled D435i IMU are needed here.
    enable_color: true
    enable_depth: false
    enable_infra1: false
    enable_infra2: false
    rgb_camera.color_profile: 640x480x15
    depth_module.depth_profile: 640x480x15
    color_qos: SENSOR_DATA
    depth_qos: SENSOR_DATA
    rgb_camera.frames_queue_size: 2
    depth_module.frames_queue_size: 2
    rgb_camera.power_line_frequency: 2
    enable_sync: false
    align_depth.enable: false
    pointcloud.enable: false
