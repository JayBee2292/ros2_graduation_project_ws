collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel
    cmd_vel_out_topic: /cmd_vel_safe
    transform_tolerance: 0.3
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: ["PolygonStop", "PolygonSlow"]
    PolygonStop:
      type: polygon
      points: [0.36, 0.30, 0.36, -0.30, -0.26, -0.30, -0.26, 0.30]
      action_type: stop
      max_points: 1
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true
    PolygonSlow:
      type: polygon
      points: [0.65, 0.40, 0.65, -0.40, -0.40, -0.40, -0.40, 0.40]
      action_type: slowdown
      max_points: 1
      slowdown_ratio: 0.35
      visualize: true
      polygon_pub_topic: polygon_slowdown
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: scan
      topic: /scan
      enabled: true
